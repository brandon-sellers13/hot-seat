<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metric — Hot Seat mock</title>
<style>
  :root{
    --bg:#F5F3EF; --card:#FFFFFF; --border:#E5E1D8; --sunken:#ECE8E0;
    --text:#1A1A1A; --mid:#4A4A4A; --muted:#6A6A6A; --faint:#A39E93;
    --indigo:#5B4BDB; --purple:#7C3AED;
    --grad:linear-gradient(135deg,#5B4BDB,#7C3AED);
    --emerald:#059669; --emerald-bg:#E7F5EE;
    --amber:#D97706; --amber-bg:#FCF3E3;
    --red:#DC2626; --red-bg:#FBEAEA;
    --indigo-bg:#ECE9FB;
    --hard:#1A1A1A;
    --wall:#EAE6DD; --table:#2A2724;
    --r:14px; --r-sm:10px;
    --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(26,26,26,.05),0 8px 24px rgba(26,26,26,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#161513; --card:#1F1D1A; --border:#33302B; --sunken:#262420;
      --text:#F2EFE9; --mid:#C9C5BD; --muted:#9B968C; --faint:#6E6960;
      --indigo:#8A7BFF; --purple:#A97BFF;
      --grad:linear-gradient(135deg,#8A7BFF,#A97BFF);
      --emerald:#3BCB93; --emerald-bg:#14291F;
      --amber:#E8A13D; --amber-bg:#2A2213;
      --red:#F26B6B; --red-bg:#2C1616;
      --indigo-bg:#242045;
      --hard:#000;
      --wall:#211F1B; --table:#0F0E0C;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#161513; --card:#1F1D1A; --border:#33302B; --sunken:#262420;
    --text:#F2EFE9; --mid:#C9C5BD; --muted:#9B968C; --faint:#6E6960;
    --indigo:#8A7BFF; --purple:#A97BFF;
    --grad:linear-gradient(135deg,#8A7BFF,#A97BFF);
    --emerald:#3BCB93; --emerald-bg:#14291F;
    --amber:#E8A13D; --amber-bg:#2A2213;
    --red:#F26B6B; --red-bg:#2C1616;
    --indigo-bg:#242045;
    --hard:#000;
    --wall:#211F1B; --table:#0F0E0C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4);
  }
  :root[data-theme="light"]{
    --bg:#F5F3EF; --card:#FFFFFF; --border:#E5E1D8; --sunken:#ECE8E0;
    --text:#1A1A1A; --mid:#4A4A4A; --muted:#6A6A6A; --faint:#A39E93;
    --indigo:#5B4BDB; --purple:#7C3AED;
    --grad:linear-gradient(135deg,#5B4BDB,#7C3AED);
    --emerald:#059669; --emerald-bg:#E7F5EE;
    --amber:#D97706; --amber-bg:#FCF3E3;
    --red:#DC2626; --red-bg:#FBEAEA;
    --indigo-bg:#ECE9FB;
    --hard:#1A1A1A;
    --wall:#EAE6DD; --table:#2A2724;
    --shadow:0 1px 2px rgba(26,26,26,.05),0 8px 24px rgba(26,26,26,.06);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;line-height:1.5}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  :focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .stage{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:0}
  @media(min-width:520px){.stage{padding:32px 16px}}
  .phone{width:100%;max-width:440px;background:var(--bg);display:flex;flex-direction:column;
    min-height:100vh;overflow:hidden;position:relative}
  @media(min-width:520px){
    .phone{min-height:min(900px,94vh);height:min(900px,94vh);border-radius:38px;
      box-shadow:var(--shadow),0 0 0 10px var(--sunken),0 0 0 12px var(--border);
      border:1px solid var(--border)}
  }

  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
    border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;
    background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px)}
  .brand{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.06em}
  .brand .br{color:var(--indigo)}
  .themebtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);
    display:grid;place-items:center;color:var(--muted);background:var(--card)}
  .themebtn:hover{color:var(--text)}

  .screens{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .screen{display:none;padding:18px 18px 28px;animation:fade .25s ease}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  .eyebrow{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:var(--faint);margin:0 0 5px}
  h1.head{font-family:var(--mono);font-size:21px;letter-spacing:-.02em;line-height:1.3;
    margin:0 0 14px;font-weight:700;text-wrap:balance}
  h1.head .hi{color:var(--indigo)}

  .pill{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:6px;white-space:nowrap}
  .pill.blue{background:var(--indigo-bg);color:var(--indigo)}
  .pill.green{background:var(--emerald-bg);color:var(--emerald)}
  .pill.amber{background:var(--amber-bg);color:var(--amber)}
  .pill.red{background:var(--red-bg);color:var(--red)}
  .pill.gray{background:var(--sunken);color:var(--muted)}

  .card-x{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
    box-shadow:var(--shadow)}

  .gbtn{display:block;width:100%;padding:13px;border-radius:var(--r-sm);background:var(--grad);
    color:#fff;font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.08em;
    text-transform:uppercase;text-align:center;border:2px solid var(--hard);
    box-shadow:3px 3px 0 var(--hard);transition:transform .12s,box-shadow .12s}
  .gbtn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--hard)}
  .gbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--hard)}
  .gbtn[disabled]{opacity:.45;pointer-events:none}
  .obtn{display:block;width:100%;padding:12px;border-radius:var(--r-sm);border:2px solid var(--border);
    background:var(--card);color:var(--mid);font-family:var(--mono);font-weight:700;font-size:12px;
    letter-spacing:.08em;text-transform:uppercase;text-align:center}
  .obtn:hover{border-color:var(--faint);color:var(--text)}
  .sbtn{padding:10px 20px;border-radius:var(--r-sm);background:var(--grad);color:#fff;
    font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    border:2px solid var(--hard);box-shadow:3px 3px 0 var(--hard);transition:transform .12s,box-shadow .12s}
  .sbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--hard)}
  .sbtn[disabled]{opacity:.4;pointer-events:none}

  .dots{position:absolute;width:66px;height:42px;opacity:.5;pointer-events:none;
    background-image:radial-gradient(var(--faint) 1.6px,transparent 1.6px);background-size:9px 9px}

  .abox{margin-top:10px}
  .abox textarea{width:100%;min-height:58px;padding:12px 13px;border-radius:var(--r-sm);
    border:2px solid var(--border);background:var(--card);color:var(--text);font-size:15px;
    line-height:1.5;resize:none;font-family:var(--sans)}
  .abox textarea::placeholder{color:var(--faint)}
  .abox textarea:focus{outline:none;border-color:var(--indigo)}
  .abox-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px}
  .timer{font-family:var(--mono);font-size:11px;color:var(--faint);display:inline-flex;
    align-items:center;gap:6px;font-variant-numeric:tabular-nums}
  .timer .tdot{width:7px;height:7px;background:var(--emerald)}
  .timer.warn{color:var(--amber)} .timer.warn .tdot{background:var(--amber)}
  .timer.stopped .tdot{background:var(--faint)}

  .verdict{border-radius:var(--r);padding:14px 15px;margin-top:12px;animation:fade .3s;
    border:2px solid var(--border)}
  .verdict.correct{background:var(--emerald-bg);border-color:var(--emerald)}
  .verdict.partial{background:var(--amber-bg);border-color:var(--amber)}
  .verdict.wrong{background:var(--red-bg);border-color:var(--red)}
  .v-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .v-word{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .verdict.correct .v-word{color:var(--emerald)}
  .verdict.partial .v-word{color:var(--amber)}
  .verdict.wrong .v-word{color:var(--red)}
  .v-lat{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
  .v-body{font-size:13.5px;line-height:1.55}
  .v-missed{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
  .v-missed li{font-size:12.5px;color:var(--mid);padding-left:14px;position:relative}
  .v-missed li::before{content:"·";position:absolute;left:2px;color:var(--amber);font-weight:700}
  .prov{margin-top:10px;border-top:1px dashed var(--border);padding-top:9px;
    font-size:12px;color:var(--muted);line-height:1.5}
  .prov b{color:var(--text);font-family:var(--mono);font-size:11.5px}
  .tier{font-family:var(--mono);font-size:9px;font-weight:700;padding:1.5px 5px;border-radius:4px;
    text-transform:uppercase;letter-spacing:.05em}
  .tier.P{color:var(--emerald);background:var(--emerald-bg)}
  .tier.S{color:var(--amber);background:var(--amber-bg)}
  .tier.F{color:#fff;background:var(--red)}

  /* ============ DAILY ============ */
  .daily-hero{text-align:center;padding:16px 0 8px;position:relative}
  .daily-hero .dots{top:0;right:4px}
  .daily-hero .ava{width:96px;image-rendering:pixelated;display:block;margin:0 auto 8px;
    filter:drop-shadow(0 6px 14px rgba(91,75,219,.25))}
  .daily-hero .dnum{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:var(--faint)}
  .daily-hero h2{font-family:var(--mono);font-size:24px;letter-spacing:-.02em;margin:6px 0 4px;
    font-weight:700;line-height:1.25}
  .daily-hero h2 .hi{color:var(--indigo)}
  .daily-hero p{font-size:13.5px;color:var(--muted);margin:0 0 16px;line-height:1.55}
  .streakrow{display:flex;justify-content:center;gap:22px;margin:14px 0 18px}
  .streakcell{text-align:center}
  .streakcell .n{font-family:var(--mono);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  .streakcell .n.hi{color:var(--indigo)}
  .streakcell .l{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--faint);margin-top:2px}
  .chainbar{display:flex;gap:5px;margin-bottom:14px}
  .chainbar .seg{height:6px;flex:1;border-radius:2px;background:var(--sunken)}
  .chainbar .seg.done-correct{background:var(--emerald)}
  .chainbar .seg.done-partial{background:var(--amber)}
  .chainbar .seg.done-wrong{background:var(--red)}
  .chainbar .seg.cur{background:var(--grad)}
  .q-card{padding:16px}
  .q-meta{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .q-text{font-size:18px;line-height:1.38;letter-spacing:-.01em;font-weight:520;text-wrap:balance}
  .q-text code{font-family:var(--mono);font-size:14px;background:var(--sunken);
    padding:3px 7px;border-radius:6px;display:inline-block;line-height:1.5}
  .nextrow{margin-top:12px}
  .tile{margin:16px auto 12px;display:flex;gap:7px;justify-content:center}
  .tile .sq{width:42px;height:42px;border-radius:8px;display:grid;place-items:center;
    font-size:16px;font-weight:700;color:#fff;font-family:var(--mono);
    border:2px solid var(--hard);box-shadow:2px 2px 0 var(--hard)}
  .sq.correct{background:var(--emerald)} .sq.partial{background:var(--amber)} .sq.wrong{background:var(--red)}
  .locknote{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--faint);
    text-align:center;margin-top:12px}

  /* ============ HOT SEAT — ace-attorney boardroom ============ */
  .scen{padding:15px 16px;margin-bottom:10px;text-align:left;width:100%;display:block;
    transition:transform .12s,box-shadow .12s;border:2px solid var(--border)!important}
  .scen:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--hard)}
  .scen .s-name{font-family:var(--mono);font-weight:700;font-size:14px;margin-bottom:4px;
    display:flex;align-items:center;gap:8px;letter-spacing:.02em}
  .scen .s-desc{font-size:13px;color:var(--muted);line-height:1.5}
  .scen.locked{opacity:.5;pointer-events:none}
  .castrow{display:flex;gap:10px;justify-content:center;margin:14px 0 4px}
  .castcell{text-align:center}
  .castcell canvas{image-rendering:pixelated}
  .castcell .cl{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);margin-top:2px}

  .aastage{position:relative;height:252px;border-radius:var(--r);overflow:hidden;
    background:var(--wall);border:2px solid var(--hard);box-shadow:4px 4px 0 var(--hard);
    margin-bottom:0}
  .aastage .dots{top:12px;right:12px}
  .aastage .window{position:absolute;top:16px;left:16px;width:80px;height:48px;border-radius:6px;
    background:linear-gradient(160deg,#CFE0F5,#EED9C9);border:2px solid color-mix(in srgb,var(--hard) 55%,transparent);opacity:.85}
  .aastage .tbl{position:absolute;left:-18px;right:-18px;bottom:0;height:44px;
    background:var(--table);border-radius:100% 100% 0 0/44px 44px 0 0;
    box-shadow:inset 0 5px 0 rgba(255,255,255,.06)}
  .speaker{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;animation:idle 3.4s ease-in-out infinite}
  @keyframes idle{0%,100%{margin-bottom:0}50%{margin-bottom:3px}}
  .speaker canvas{image-rendering:pixelated;display:block}
  .speaker.enter{animation:slidein .3s ease}
  @keyframes slidein{from{opacity:0;transform:translateX(-50%) translateX(26px)}
    to{opacity:1;transform:translateX(-50%)}}
  .speaker.nod{animation:nodA .5s ease 2}
  @keyframes nodA{0%,100%{margin-bottom:0}50%{margin-bottom:-5px}}
  .speaker.shakeA{animation:shakeA .5s ease 1}
  @keyframes shakeA{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 4px))}
    75%{transform:translateX(calc(-50% + 4px))}}
  .nameplate{position:absolute;left:12px;bottom:12px;z-index:3;background:var(--hard);color:#fff;
    padding:5px 10px;border-radius:6px;display:flex;align-items:center;gap:7px}
  .nameplate .nm{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em}
  .nameplate .dm{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.1em;
    padding:2px 5px;border-radius:4px;background:var(--indigo);color:#fff;text-transform:uppercase}
  .nameplate .dm.fin{background:#B03A3A}.nameplate .dm.prod{background:#3E7A46}
  .nameplate .dm.gro{background:#C07A1F}.nameplate .dm.chair{background:var(--indigo)}
  .credwrap{position:absolute;right:12px;top:12px;z-index:3;text-align:right}
  .credlab{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.12em;
    color:var(--muted);text-transform:uppercase;margin-bottom:3px}
  .credbar{display:flex;gap:3px;justify-content:flex-end}
  .credbar .pip{width:14px;height:9px;background:var(--emerald);border:1.5px solid var(--hard)}
  .credbar .pip.lost{background:var(--sunken)}
  .credbar .pip.losing{animation:pipflash .6s steps(2) 2;background:var(--red)}
  @keyframes pipflash{50%{opacity:.2}}
  .youcorner{position:absolute;right:8px;bottom:-6px;width:64px;image-rendering:pixelated;z-index:3}
  .sweat{position:absolute;right:14px;bottom:52px;width:9px;height:12px;
    background:#7CC7F0;border-radius:50% 50% 55% 55%;border:1.5px solid var(--hard);
    opacity:0;z-index:4}
  .sweat.show{opacity:1;animation:drip 1.2s ease-in infinite}
  @keyframes drip{0%{transform:translateY(0)}80%{opacity:1}100%{transform:translateY(16px);opacity:0}}
  .aastage.flash-red::after,.aastage.flash-green::after{content:"";position:absolute;inset:0;
    pointer-events:none;z-index:5;animation:flashfade 1s ease forwards}
  .aastage.flash-red::after{background:color-mix(in srgb,var(--red) 32%,transparent)}
  .aastage.flash-green::after{background:color-mix(in srgb,var(--emerald) 26%,transparent)}
  @keyframes flashfade{from{opacity:1}to{opacity:0}}
  .aastage.quake{animation:quake .45s ease 1}
  @keyframes quake{0%,100%{transform:translate(0)}20%{transform:translate(-5px,2px)}
    40%{transform:translate(5px,-2px)}60%{transform:translate(-4px,0)}80%{transform:translate(4px,2px)}}

  /* interjection card */
  .interject{position:absolute;inset:0;display:grid;place-items:center;z-index:8;pointer-events:none}
  .interject .icard{font-family:var(--mono);font-weight:700;font-style:italic;
    font-size:26px;letter-spacing:.02em;padding:14px 22px;border:3px solid var(--hard);
    background:#fff;color:var(--red);box-shadow:6px 6px 0 var(--hard);transform:rotate(-6deg);
    animation:slam .55s cubic-bezier(.2,1.4,.4,1) forwards;white-space:nowrap}
  .interject .icard.good{color:var(--indigo)}
  @keyframes slam{0%{transform:rotate(-6deg) scale(3);opacity:0}
    55%{transform:rotate(-6deg) scale(.95);opacity:1}
    70%{transform:rotate(-6deg) scale(1.05)}100%{transform:rotate(-6deg) scale(1)}}

  /* AA dialog box */
  .dialog{position:relative;background:var(--card);border:2px solid var(--hard);
    border-radius:12px;box-shadow:4px 4px 0 var(--hard);padding:12px 14px 13px;
    margin:14px 2px 12px;min-height:86px}
  .dtag{position:absolute;top:-12px;left:12px;background:var(--grad);color:#fff;
    font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;padding:4px 10px;border-radius:6px;border:2px solid var(--hard)}
  .dtext{font-size:14.5px;line-height:1.55;padding-top:4px;min-height:44px}
  .dtext b{color:var(--indigo)}
  .dnext{position:absolute;right:12px;bottom:8px;font-family:var(--mono);font-size:10px;
    color:var(--faint);animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:.15}}
  .dverdict{margin-top:8px}
  .worked{font-family:var(--mono);font-size:12.5px;line-height:1.7;background:var(--sunken);
    border:1px solid var(--border);border-radius:8px;padding:10px 13px;margin-top:10px;
    overflow-x:auto;white-space:pre}
  .worked .wl{color:var(--indigo);font-weight:700}
  .rubric{margin-top:10px;border-top:1px dashed var(--border);padding-top:10px;
    display:flex;flex-direction:column;gap:6px}
  .rubric .rh{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;color:var(--faint)}
  .rubric .ri{display:flex;gap:8px;font-size:12.5px;line-height:1.4;align-items:flex-start}
  .rubric .ri .rm{font-family:var(--mono);font-size:10px;font-weight:700;width:16px;height:16px;
    display:grid;place-items:center;border-radius:4px;flex:none;margin-top:1px}
  .rubric .ri.hit .rm{background:var(--emerald-bg);color:var(--emerald)}
  .rubric .ri.miss .rm{background:var(--red-bg);color:var(--red)}
  .rubric .ri.miss{color:var(--muted)}
  .mini-verdict{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);
    font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:4px 9px;border-radius:6px}
  .mini-verdict.correct{background:var(--emerald-bg);color:var(--emerald)}
  .mini-verdict.partial{background:var(--amber-bg);color:var(--amber)}
  .mini-verdict.wrong{background:var(--red-bg);color:var(--red)}
  .mini-verdict.trap{background:var(--red);color:#fff}
  .turnlab{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .turnlab .tl1{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;color:var(--faint)}

  .sv{text-align:center;padding:14px 0}
  .sv .sv-word{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1;margin:12px 0 6px}

  .backbtn{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;

    margin-bottom:12px;padding:4px 0}

      ctx.fillRect(x*P,y*P,P,P);
    }
  });
  const skin=pal[f.skin],brow=f.brow,dark='#1A1A1A';
  const p=(x,y,c)=>{ctx.fillStyle=c;ctx.fillRect(x*P,y*P,P,P);};
  const clr=(x,y)=>p(x,y,skin);
  for(let x=f.mouthCols[0];x<=f.mouthCols[1]+1;x++){clr(x,f.mouthRow);clr(x,f.mouthRow-1);}
  if(who==='pro'){for(let x=2;x<=9;x++)p(x,9,pal.M);}
  if(mood==='neutral'){
    for(let x=f.mouthCols[0]+1;x<=f.mouthCols[1];x++)p(x,f.mouthRow,dark);
  }else if(mood==='stern'){
    for(let x=f.mouthCols[0];x<=f.mouthCols[1]+1;x++)p(x,f.mouthRow,dark);
    f.browCols.forEach(([a,b])=>{p(a,f.browRow,brow);p(b,f.browRow,brow);});
  }else if(mood==='pleased'){
    for(let x=f.mouthCols[0]+1;x<=f.mouthCols[1];x++)p(x,f.mouthRow,dark);
    p(f.mouthCols[0],f.mouthRow-1,dark);p(f.mouthCols[1]+1,f.mouthRow-1,dark);
  }else if(mood==='shock'){
    p(5,f.mouthRow-1,dark);p(6,f.mouthRow-1,dark);
    p(5,f.mouthRow,dark);p(6,f.mouthRow,dark);
  }else if(mood==='angry'){
    p(f.mouthCols[0],f.mouthRow,dark);p(f.mouthCols[1]+1,f.mouthRow,dark);
    for(let x=f.mouthCols[0]+1;x<=f.mouthCols[1];x++)p(x,f.mouthRow-1,dark);
    f.browCols.forEach(([a,b])=>{p(b,f.browRow+1,brow);p(a,f.browRow+1,brow);});
  }
}

/* =================== helpers =================== */
const $=s=>document.querySelector(s);
function grade(answer,groups,needed){
  const a=answer.toLowerCase();
  const hit=[],missed=[];
  for(const g of groups){if(g.syn.some(s=>a.includes(s)))hit.push(g);else missed.push(g);}
  return {v:hit.length>=needed?'correct':hit.length>=1?'partial':'wrong',hit,missed};
}
const VWORD={correct:'Nailed it',partial:'Partial',wrong:'Missed'};

function answerBox({placeholder,threshold,onSubmit,onWarn}){
  const wrap=document.createElement('div');
  wrap.className='abox';
  wrap.innerHTML=`
    <textarea rows="2" placeholder="${placeholder||'Type your answer…'}"></textarea>
    <div class="abox-row">
      <span class="timer"><span class="tdot"></span><span class="tv">thinking · 0.0s</span></span>
      <button class="sbtn" disabled>Answer</button>
    </div>`;
  const ta=wrap.querySelector('textarea'),btn=wrap.querySelector('.sbtn');
  const timerEl=wrap.querySelector('.timer'),tv=wrap.querySelector('.tv');
  const t0=performance.now();let tFirst=null,raf=null,warned=false;
  const tick=()=>{
    const el=(performance.now()-t0)/1000;
    tv.textContent=`thinking · ${el.toFixed(1)}s`;
    if(el*1000>threshold&&!warned){timerEl.classList.add('warn');warned=true;onWarn&&onWarn();}
    if(tFirst===null)raf=requestAnimationFrame(tick);
  };
  raf=requestAnimationFrame(tick);
  ta.addEventListener('input',()=>{
    if(tFirst===null&&ta.value.trim()){
      tFirst=performance.now();cancelAnimationFrame(raf);
      timerEl.classList.add('stopped');
      tv.textContent=`thought · ${((tFirst-t0)/1000).toFixed(1)}s`;
    }
    btn.disabled=!ta.value.trim();
  });
  ta.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!btn.disabled)btn.click();}
  });
  btn.addEventListener('click',()=>{
    const thinkMs=(tFirst??performance.now())-t0;
    ta.disabled=true;btn.disabled=true;
    onSubmit(ta.value.trim(),Math.round(thinkMs),thinkMs>threshold);
  });
  setTimeout(()=>ta.focus(),80);
  return wrap;
}

/* typewriter */
let twTimer=null;
function typeText(el,html,done){
  const tmp=document.createElement('div');tmp.innerHTML=html;
  const plain=tmp.textContent;
  let i=0;clearInterval(twTimer);
  el.textContent='';
  const finish=()=>{clearInterval(twTimer);el.innerHTML=html;el.onclick=null;done&&done();};
  el.onclick=finish;
  twTimer=setInterval(()=>{
    i+=2;
    if(i>=plain.length){finish();return;}
    el.textContent=plain.slice(0,i);
  },22);
}

      }
      /* stage reaction + credibility */
      const setMood=m=>drawSprite($("#spkcv"),c.sprite,m,9);
      if(ex.trap){
        if(tier==='command'){
          interject('THE ROOM’S YOURS.',true);
          setTimeout(()=>{setMood('pleased');stage.classList.add('flash-green');spk.classList.add('nod');},700);
        } else if(tier==='anchor'){
          interject('COUNTERED.',true);
          setTimeout(()=>{setMood('shock');stage.classList.add('flash-green');spk.classList.add('nod');},700);
        } else if(tier==='strategy'||tier==='challenge'){
          setMood('stern');spk.classList.add('shakeA');
        } else {
          interject('BURNED.');
          setMood('angry');stage.classList.add('flash-red','quake');
          loseCred(2);
        }
      } else if(g.v==='correct'){
        setMood('pleased');spk.classList.add('nod');stage.classList.add('flash-green');
      } else if(g.v==='partial'){
        setMood('stern');spk.classList.add('shakeA');
      } else {
        setMood('angry');spk.classList.add('shakeA');stage.classList.add('flash-red');
        loseCred(1);
      }
      setTimeout(()=>{stage.classList.remove('flash-green','flash-red','quake');
        spk.classList.remove('nod','shakeA');},1150);
      /* verdict + reply */
      $("#dverdict").innerHTML=`<span class="mini-verdict ${vClass}">${vLabel} · ${(ms/1000).toFixed(1)}s${hes?' · hesitated':''}</span>`;
      const replyText=ex.trap?{command:ex.replyCommand,anchor:ex.replyAnchor,strategy:ex.replyStrategy,
        challenge:ex.replyChallenge,burned:ex.replyBurned}[tier]:ex.reply[g.v];
      setTimeout(()=>{
        typeText($("#dtext"),replyText,()=>{
          if(ex.work){$("#dtext").insertAdjacentHTML('beforeend','<div class="worked">'+ex.work.join('\n')+'</div>');}
          if(ex.rubric){$("#dtext").insertAdjacentHTML('beforeend',
            '<div class="rubric"><div class="rh">The board answer</div>'+
            ex.rubric.map(r=>`<div class="ri ${rubHits[r.key]?'hit':'miss'}"><span class="rm">${rubHits[r.key]?'✓':'✕'}</span><span>${r.t}</span></div>`).join('')+
            '</div>');}
          const inp=$("#hsInput");inp.innerHTML='';
          const last=hsIdx>=HS_SCRIPT.length-1;
          const dead=cred<=0;
          const nxt=document.createElement('div');nxt.className='nextrow';
          nxt.innerHTML=`<button class="gbtn">${dead?'It’s over':last?'End of meeting':'Continue'}</button>`;
          nxt.querySelector('button').addEventListener('click',()=>{
            if(dead){hsVerdict(true);return;}
            hsIdx++;hsIdx<HS_SCRIPT.length?hsTurn():hsVerdict(false);
          });
          inp.appendChild(nxt);
          nxt.querySelector('button').focus();
        });
      },950);
    }}));
}
function hsVerdict(adjourned){
  const wrongs=hsResults.filter(r=>r.v==='wrong'&&!r.trap).length;
  const partials=hsResults.filter(r=>r.v==='partial').length;
  const hess=hsResults.filter(r=>r.hes).length;
  const outcome=adjourned?'adjourned':hsTrapBurned?'burned':(wrongs>0||partials>1||hess>1)?'wounded':'survived';
  const subs={
    survived:'Clean answers, trap defused, credibility intact. The room moved on to sales. That’s a win.',
    wounded:'You made it out, but the room saw the seams. The cards you slipped on come back in tomorrow’s Daily.',
    burned:'You accepted a number that doesn’t exist, in front of the people pricing the round. That card is pinned to your Daily until you can kill it on sight.',
    adjourned:'Credibility hit zero. The CEO called it early — “let’s pick this up async.” Nobody means that kindly.'};
  hsBody.innerHTML=`
    <div class="sv">
      <p class="eyebrow">Board meeting · verdict</p>
      <div class="sv-word ${outcome}"><span class="br">[</span> <span class="w">${outcome.toUpperCase()}</span> <span class="br">]</span></div>
      <p class="sv-sub">${subs[outcome]}</p>
      <div class="sv-rows">${hsResults.map(r=>`
        <div class="sv-row card-x">
          <span class="pill ${r.trap?(r.v==='correct'?'green':'red'):r.v==='correct'?'green':r.v==='partial'?'amber':'red'}">${r.trap?(r.v==='correct'?'defused':'burned'):r.v}</span>
          <span class="t">${r.card}</span>
          <span class="ms">${(r.ms/1000).toFixed(1)}s${r.hes?' ⚠':''}</span>
        </div>`).join('')}
      </div>
      <button class="gbtn" id="hsAgain">Take the seat again</button>
      <div class="locknote">verdicts feed the scheduler · weak cards surface in the Daily · credibility left: ${cred}/5</div>
    </div>`;
  $("#hsAgain").addEventListener('click',hsIntro);
}

const ORDER=["nrr","churn","sqr","liq","ltvcac","payback","ro40","wpipe"];

const FILTERS=[["all","All"],["retention","Retention"],["unit","Unit econ"],["revenue","Revenue"],["pipeline","Pipeline"],["growth","Growth"],["finance","Finance"]];
function ctxPill(c){
  if(c==="b2b")return '<span class="pill amber">B2B</span>';
  if(c==="finance")return '<span class="pill gray">Finance</span>';
  return '<span class="pill blue">Consumer · B2B</span>';
}
function renderFilters(){
  $("#filters").innerHTML=FILTERS.map(([k,l])=>`<button class="fbtn ${filter===k?'on':''}" data-f="${k}">${l}</button>`).join('');
  $("#filters").querySelectorAll('.fbtn').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.f;renderFilters();renderList();}));
}
function renderList(){
  const q=$("#searchInput").value.trim().toLowerCase();
  $("#disambig").innerHTML=q.includes("quick")?`<div class="disambig"><b>3 metrics match "quick ratio"</b>"Quick ratio" names three unrelated metrics. Tap to disambiguate.</div>`:'';
  const rows=ORDER.filter(id=>{
    const c=CARDS[id];
    if(filter!=="all"&&c.fam!==filter)return false;
    if(q)return (c.name+' '+c.aka+' '+c.family).toLowerCase().includes(q);
    return true;
  });
  $("#clist").innerHTML=rows.length?rows.map(id=>{
    const c=CARDS[id];
    let badges=c.bench?`<span class="tier ${c.bench[0].tier}">${c.bench[0].tier}</span>`:'';
    if(c.absent)badges+=`<span class="tier S">⌀</span>`;
    if(c.fab)badges+=`<span class="tier F">FAB</span>`;
    return `<button class="crow card-x" data-id="${id}">
      <div class="cr-top"><span class="cr-name">${c.name}</span><span class="cr-aka">${c.aka.split(' · ')[0]}</span></div>
      <div class="cr-def">${c.def}</div>
      <div class="cr-meta">${ctxPill(c.ctx)}<span class="pill gray">${c.family}</span>${badges}</div>
    </button>`;}).join('')
    :`<div style="text-align:center;color:var(--faint);font-family:var(--mono);font-size:12px;padding:40px 0">No metric matches that.</div>`;
  $("#clist").querySelectorAll('.crow').forEach(b=>b.addEventListener('click',()=>openCard(b.dataset.id)));
}
function facet(num,label,inner,open){
  return `<div class="facet ${open?'open':''}">
    <button class="facet-h"><span class="fl"><span class="num">${num}</span>${label}</span>
    <span class="caret"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span></button>
    <div class="facet-body">${inner}</div></div>`;
}
function openCard(id){
  const c=CARDS[id];
  $("#refList").style.display='none';
  const d=$("#refDetail");d.style.display='block';
  const formulas=c.formulas.map(f=>`<div class="fvar"><div class="fv-name">${f.n}</div><div class="fv-f">${f.f}</div><div class="fv-when">${f.w}</div></div>`).join('');
  let bench=(c.bench||[]).map(b=>`<div class="provrow"><span class="val">${b.val}</span><span class="tier ${b.tier}">${b.tier}</span><span class="src">${b.src}</span></div>`).join('');
  if(c.absent)bench+=`<div class="prov-abs">⌀ ${c.absent}</div>`;
  if(c.fab)bench+=`<div class="prov-fab"><div class="fh">⚠ Fabricated figure in circulation</div><b>"${c.fab.claim}"</b><br>${c.fab.note}</div>`;
  d.innerHTML=`
    <button class="backbtn" id="backBtn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg> All metrics</button>

    ${facet('01','Definition',`<p>${c.def}</p>`,true)}
    ${facet('02','Formula variants',formulas,false)}
    ${facet('03','Benchmark',bench,true)}

  $(".screens").scrollTop=0;
}
