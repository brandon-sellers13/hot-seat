name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The corpus is the asset, and the extracted data is committed so that
      # consumers get it without running a build. Regenerating it here and
      # failing on any diff is what keeps the committed copy honest: a research
      # edit that changes the cards must land with its regenerated output, and
      # a hand-edit of the generated data cannot survive review.
      - name: Corpus extraction is reproducible from the research
        run: |
          npm run extract --workspace @hot-seat/corpus
          git diff --exit-code -- packages/corpus/data \
            || { echo "::error::Committed corpus data does not match the research files. Run 'npm run extract --workspace @hot-seat/corpus' and commit the result."; exit 1; }
