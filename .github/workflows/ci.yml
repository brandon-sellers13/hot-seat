name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The corpus is the asset. If a research edit breaks extraction, that
      # should fail here rather than surface later as a missing card.
      - name: Corpus extraction stays reproducible
        run: npm run extract --workspace @hot-seat/corpus --if-present
